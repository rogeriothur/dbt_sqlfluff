name: SQLFluff Validation

# Trigger on push and pull requests
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  sqlfluff-lint:
    name: Lint SQL with SQLFluff
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install SQLFluff and dependencies
      - name: Install SQLFluff and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlfluff sqlfluff-templater-dbt dbt-duckdb

      # Step 4: Verify SQLFluff installation
      - name: Check SQLFluff version
        run: sqlfluff --version

      # Step 5: Lint SQL models
      - name: Lint SQL with SQLFluff
        run: |
          sqlfluff lint models/ \
            --dialect duckdb \
            --ignore templating,parsing

      # Step 6: Report success
      - name: SQLFluff validation passed
        if: success()
        run: echo "✅ All SQL files passed SQLFluff validation!"
